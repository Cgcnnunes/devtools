name: Release HeaderLab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-headerlab.yml

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w headerlab
      - id: version
        run: echo "value=$(node -p "require('./tools/headerlab/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Zip the extension
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: (cd tools/headerlab/dist && zip -qrX "$GITHUB_WORKSPACE/headerlab-$VERSION.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: headerlab-extension
          path: headerlab-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: headerlab-extension
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          tag="headerlab-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists. Bump the version in tools/headerlab/package.json first." >&2
            exit 1
          fi
          notes="Unzip headerlab-$VERSION.zip, open chrome://extensions, switch on Developer mode, click Load unpacked and select the unzipped folder.

          Setup guide: https://github.com/$GH_REPO/blob/main/tools/headerlab/README.md#setup"
          gh release create "$tag" "headerlab-$VERSION.zip" --target "$SHA" --title "HeaderLab $VERSION" --notes "$notes"
